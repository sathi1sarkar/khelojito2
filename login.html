<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login_style.css" />
    <title>Hello, world!</title>
</head>

<body>
    <div class="phone-wrapper" style="background-image: url('images/bg-2.png');">
        <div>
            <nav>
                <div class="header-left">
                    <img src="images/logo2.png" />
                </div>
                <div class="header-right">
                    <div class="">
                        <a href="login.html" class="button d-flex align-items-center">
                            <i class="fa-solid fa-headset"></i> Customer Service
                        </a>
                    </div>
                </div>
            </nav>
            <div class="page-body">
                <div class="log">
                    <h4>Log In</h4>
                    <p class="mb-0">Please log in with your phone number or email</p>
                    <p class="mb-0">If you forget your password, please contact customer service</p>
                </div>

                <div class="login-container">
                    
                    <div class="form-container">
                        <h1 class="opacity">LOGIN</h1>
                        <form>
                            <input type="text" placeholder="Phone Number" />
                            <input type="password" placeholder="Password" />
                            <button class="login">Login</button>
                        </form>  
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
    </script>
</body>

</html>
